<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>Redwood Relocation Guide</title>
  <meta name="description" content="Find which of Redwood Financial's five new office cities fits your life best.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="masthead__inner">
      <a class="brand" href="#fit" aria-label="Redwood Financial relocation guide, start page">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="15.4" cy="16.6" r="10.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <circle cx="14.9" cy="17" r="6.3" fill="none" stroke="currentColor" stroke-width="1.1"/>
          <circle cx="14.6" cy="17.3" r="2.6" fill="currentColor"/>
        </svg>
        <span class="brand__name">Redwood Financial</span>
        <span class="brand__product">Relocation guide</span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <a class="tabs__link" href="#fit" data-tab="fit">Find your fit</a>
        <a class="tabs__link" href="#cities" data-tab="cities">The cities</a>
        <a class="tabs__link" href="#how" data-tab="how">How we chose</a>
      </nav>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <div class="loading" role="status">Loading the city data…</div>
  </main>

  <footer class="colophon">
    <div class="colophon__inner">
      <p>Built by the CS 218 Redwood team for Redwood Financial employees. Scores compare 500 U.S. cities using public data; they are a starting point for your own research, not a guarantee.</p>
      <p id="data-status"></p>
    </div>
  </footer>

  <div id="popover" class="popover" role="dialog" aria-modal="false" hidden></div>

  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
